# Config to optimize scenes from mipNeRF 360 dataset (converted to TASE format)
# Including semantic features that can be used for semantic segmentation and semantic view synthesis

# I/O
dataset_type: TASE
result_dir: /{}/{}

# Training
max_steps: 30000
batch_size: 1
test_every: 8
global_scale: 1.0
normalize_world_space: true

# Checkpoints & eval
eval_steps: [1000, 10000]
save_steps: [1000, 10000]
save_ply: false

# Initialization
init_type: pointcloud
init_num_pts: 150000
init_extent: 3.0
init_scale: 1.2
init_opa: 0.8
max_init_size: 0.8
sh_degree: 2
sh_degree_interval: 5000

# Rendering
near_plane: 0.01
far_plane: 1000000000.0
camera_model: pinhole
background_model: mlp
antialiased: true

# Losses
feature_loss: true
feature_lambda: 0.3
num_semantic_features: 64   # Set this to the max ctrl dims of the ctrl net to avoid unneccessary computation
feature_only_iters: 0
ssim_lambda: 0.1
l1_lambda: 0.3
depth_loss: false
normal_loss: false

feature_dist_regularization: 0.1
feature_dist_loss_interval: 10

feature_local_smoothness: 50.0
feature_smoothness_loss_interval: 10
feature_knn_recompute_max_steps: 100
feature_knn_K: 8
feature_knn_max_dist: 0.2

# Regularization
opacity_reg: 0.0
scale_reg: 0.001

# Densification
strategy:
  prune_opa: 0.005
  grow_grad2d: 0.001
  grow_scale3d: 0.05
  grow_scale2d: 0.001
  prune_scale3d: 100.0
  prune_scale2d: 0.15
  refine_scale2d_stop_iter: 0
  refine_start_iter: 500
  refine_stop_iter: 5000
  reset_every: 1000
  refine_every: 100
  pause_refine_after_reset: 100
  absgrad: True

# Learning rates
learning_rates:
  means: 0.00016
  scales: 0.005
  opacities: 0.05
  quats: 0.001
  sh0: 0.0025
  shN: 0.000125
  features: 0.001
